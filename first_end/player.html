<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐 · 播放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./wangyiyun.css">
    <script src="./wangyiyun.js" defer></script>
</head>
<body>
    <!-- 播放详情页 (全屏) -->
    <div class="player-detail">
        <!-- 播放器背景模糊层 -->
        <div class="player-backdrop"></div>
        
        <!-- 顶部导航 -->
        <div class="player-detail-header">
            <i class="fas fa-chevron-down" onclick="goBack()"></i>
            <div class="player-detail-title">
                <div class="now-playing">正在播放</div>
                <div class="playlist-name">摇滚经典 · 迷墙与梦想</div>
            </div>
            <i class="fas fa-ellipsis-h"></i>
        </div>

        <!-- 唱片动画区域 -->
        <div class="record-container">
            <div class="record-arm playing"></div>
            <div class="record-disc">
                <div class="record-cover mock-img"></div>
            </div>
        </div>

        <!-- 歌曲信息 -->
        <div class="player-song-info">
            <!-- 作者 -->
        </div>

        <!-- 歌词区域 -->
        <div class="lyrics-container">
            <div class="lyrics-content" id="lyricsContent">
                <!-- 歌词 -->
            </div>
        </div>

        <!-- 进度条 -->
        <div class="player-progress">
            <div class="progress-time">
                <span class="current-time">2:35</span>
                <span class="total-time">5:55</span>
            </div>
            <div class="progress-bar-detail">
                <div class="progress-current-detail" style="width: 45%;"></div>
            </div>
        </div>

        <!-- 播放控制 -->
        <div class="player-controls-detail">
            <div class="control-mode">
                <i class="fas fa-random"></i>
            </div>
            <div class="control-prev">
                <i class="fas fa-step-backward"></i>
            </div>
            <div class="control-play">
                <i class="fas fa-pause-circle"></i>
            </div>
            <div class="control-next">
                <i class="fas fa-step-forward"></i>
            </div>
            <div class="control-loop">
                <i class="fas fa-redo-alt"></i>
            </div>
        </div>

        <!-- 底部控制栏 -->
        <div class="player-detail-footer">
            <div class="footer-left">
                <i class="fas fa-heart"></i>
                <i class="fas fa-download"></i>
            </div>
            <div class="footer-center">
                <i class="fas fa-list-ul"></i>
                <span class="playlist-count">8/68</span>
            </div>
            <div class="footer-right">
                <i class="fas fa-volume-up"></i>
                <div class="volume-bar-detail">
                    <div class="volume-fill-detail" style="width: 70%;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
